server:
  port: ${PORT:8080}

spring:
  application:
    name: codelab-backend
  
  datasource:
    #    jdbc:mysql://mysql-16d1b545-ashishshahani19162-3707.f.aivencloud.com:11440/defaultdb?ssl-mode=REQUIRED&useSSL=true&requireSSL=true
    #    mysql://avnadmin:AVNS_6VY0z1Vy2FONTOQ5-fZ@mysql-16d1b545-ashishshahani19162-3707.f.aivencloud.com:11440/defaultdb?ssl-mode=REQUIRED
    url: ${CLOUD_DB_URL}
    username: ${CLOUD_DB_USERNAME}
    password: ${CLOUD_DB_PASSWORD}
    #      url: ${DB_URL}
    #      username: ${DB_USERNAME}
    #      password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 3
      minimum-idle: 1
      data-source-properties:
        useSSL: true
        requireSSL: true
        verifyServerCertificate: false
  
  jpa:
    hibernate:
      ddl-auto: update        # auto-creates/updates tables. Use 'validate' in prod
    show-sql: true            # set false in prod
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  #  OAuth2 property
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

# JWT Config
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION}
  frontend-url: ${APP_FRONTEND_URL}
  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR}


# Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha


cloudinary:
  cloud-name: ${CLOUDY_NAME}
  api-key: ${CLOUDY_KEY}
  api-secret: ${CLOUDY_SECRET}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_ROLE}
  bucket: ${SUPABASE_BUCKET}
